[workspace]
# compat-tests is deliberately NOT a workspace member: it path-depends on a
# sibling checkout of the (private) full SDK, and membership would make every
# cargo invocation in this repo — including `cargo fmt` and `cargo metadata` —
# fail wherever that sibling is absent, e.g. the standalone CI job. Excluded,
# it is its own root package, run explicitly with:
#     cargo test --manifest-path compat-tests/Cargo.toml
exclude = ["compat-tests"]
members = ["wasm"]

[package]
name = "aqua-rs-sdk-core"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Minimal, WASM-free core of the Aqua protocol SDK: anchor, object, and template primitives with base signatures and the agentic audit-trail templates."
readme = "README.md"
keywords = ["aqua", "aqua-protocol", "audit", "provenance"]
categories = ["development-tools", "cryptography"]
repository = "https://github.com/inblockio/aqua-rs-sdk-core"
exclude = ["target", "*.lock", ".vscode", ".idea", "compat-tests"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "verify-templates"
path = "src/bin/verify_templates.rs"
required-features = ["native"]

[[bin]]
name = "regen-unsupported"
path = "src/bin/regen_unsupported.rs"
required-features = ["native"]

[features]
default = ["native"]
# Platform-specific: enables the EIP-191 secp256k1 signer.
native = []

[dependencies]
jsonschema = { version = "0.33", default-features = false }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde = { version = "1.0.227", features = ["derive"] }
async-trait = "0.1"
thiserror = "2.0.16"
jsonpointer_flatten = "0.1.3"
serde_with = "3.14.1"
hex = "0.4.3"
sha3 = "0.10.8"
blake3 = "1"
rand = "0.8"
sha2 = { version = "0.10", features = ["oid"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.21"
multibase = "0.9"
hkdf = "0.12"

# wasm32-unknown-unknown has no OS entropy or wall clock of its own. Both
# getrandom majors are in the graph (0.2 via rand/ed25519-dalek/k256/p256,
# 0.3 via jsonschema -> ahash) and each needs its JS backend switched on;
# 0.3 additionally needs the `getrandom_backend="wasm_js"` cfg from
# .cargo/config.toml. js-sys backs `Timestamp::now()` and
# `current_time_secs()` on that target. Native builds see none of this.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"

[dev-dependencies]
tokio = { version = "1.0", features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }

# Size-first release profile for the wasm member (wasm-pack builds with
# `--release`). Profiles are workspace-wide, so native release builds of the
# core crate and its two bins inherit this too; they are not perf-sensitive.
[profile.release]
opt-level = "z"
lto = true
