# CI for aqua-rs-sdk-core (backlog B7).
#
# Two jobs, because this repo's test suite is split by what it needs:
#
#   core    everything that runs from this checkout alone. This only works
#           because compat-tests is NOT a workspace member (see the root
#           Cargo.toml): as a member, its path dependency on the sibling
#           full SDK made even `cargo fmt`/`cargo metadata` fail without
#           that sibling — which is exactly how this job was red on every
#           run before 2026-08-07.
#   compat  the compat-tests crate, run by manifest path. It path-depends
#           on a SIBLING checkout of the full SDK (../aqua-rs-sdk next to
#           this repo) and therefore has to clone it.
#
# NOTE ON THE COMPAT JOB: it needs a checkout of inblockio/aqua-rs-sdk,
# which is currently PRIVATE. The clone step therefore has three outcomes,
# chosen so that CI is never red for a reason no commit can fix, and never
# green while hiding a failure someone opted into:
#
#   1. The repo is reachable (public, or the AQUA_RS_SDK_READ_TOKEN secret
#      is set): the suite runs and gates for real.
#   2. No token is configured and the clone fails for lack of access: the
#      job emits a prominent warning annotation plus a run-summary block
#      saying the compat suite DID NOT RUN, and skips. This is a visible
#      skip, not a silent one — the "green because uncovered" failure this
#      project was bitten by once was a suite that LOOKED like coverage.
#   3. A token IS configured but the clone fails, or the clone fails for
#      any non-access reason (network, etc.): hard failure. A credential
#      someone set up must not rot into a quiet skip.
#
# To restore real coverage while the full SDK stays private: create a
# fine-grained PAT with read-only Contents access to inblockio/aqua-rs-sdk
# and add it as the AQUA_RS_SDK_READ_TOKEN repository secret. The moment
# the repo goes public (upstream migration is planned), coverage resumes
# by itself with no workflow edit.
#
# Every command below is also the local verification list. Run them in this
# order from a clean checkout and CI should agree with you.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings only where the baseline is clean (see the clippy step).
  RUST_BACKTRACE: 1

jobs:
  core:
    name: build, test, lint (standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version && cargo --version

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Formatting is checked for this package only. compat-tests carries
      # formatting drift inherited from the extraction; reformatting it would
      # be unrelated churn in the file that proves subset compatibility.
      - name: Check formatting
        run: cargo fmt -p aqua-rs-sdk-core --check

      - name: Build
        run: cargo build --locked --features native --all-targets

      # compat-tests is not a workspace member, so this covers exactly the
      # publishable package. The compat suite is the compat job.
      - name: Unit tests and binaries
        run: cargo test --locked --lib --bins

      - name: Doc tests
        run: cargo test --locked --doc

      # The lib carries 14 inherited warnings in files copied verbatim from the
      # full SDK; fixing them there would fork files that are meant to stay
      # byte-comparable. So the gate is the correctness group (real bugs),
      # not the total warning count, which would break on every new lint.
      - name: Clippy (deny correctness)
        run: cargo clippy --locked --lib --features native -- -D clippy::correctness

      - name: Rustdoc builds
        run: cargo doc --locked --no-deps --features native

      # Template hash = type identity. This is the drift alarm.
      - name: Template hash cascade
        run: cargo run --locked --features native --bin verify-templates

      - name: End-to-end example
        run: cargo run --locked --example agent_audit_trail --features native

      - name: Packaging (publish dry run)
        run: cargo publish --locked --dry-run

      # A release tag must name the Cargo.toml version. This is the cheap
      # half of RELEASE.md: it cannot publish, it can only refuse a lie.
      - name: Tag matches Cargo.toml (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag Cargo.toml=$ver"
          test "$tag" = "$ver"

  compat:
    name: subset compatibility with the full SDK
    runs-on: ubuntu-latest
    env:
      # Optional fine-grained PAT, read-only on inblockio/aqua-rs-sdk. Empty
      # string when the secret is not configured.
      COMPAT_TOKEN: ${{ secrets.AQUA_RS_SDK_READ_TOKEN }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      # Both repos land as siblings under the workspace directory, which is
      # what compat-tests/Cargo.toml's `path = "../aqua-rs-sdk"` expects.
      - uses: actions/checkout@v4
        with:
          path: aqua-rs-sdk-core

      # See the header comment for the three outcomes this step encodes.
      # The token travels as an ephemeral per-command header (the same
      # mechanism actions/checkout uses) so it is never written to disk.
      - name: Clone the full SDK as a sibling checkout
        id: sdk
        run: |
          auth=()
          if [ -n "$COMPAT_TOKEN" ]; then
            basic=$(printf 'x-access-token:%s' "$COMPAT_TOKEN" | base64 -w0)
            auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic")
          fi
          if git "${auth[@]}" clone --depth 1 \
              https://github.com/inblockio/aqua-rs-sdk.git aqua-rs-sdk \
              2>clone-stderr.txt; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat clone-stderr.txt
          if [ -n "$COMPAT_TOKEN" ]; then
            echo "::error title=compat clone failed with a configured token::AQUA_RS_SDK_READ_TOKEN is set but cloning inblockio/aqua-rs-sdk failed. The token has likely expired or lost access. Fix or remove the secret; this job will not silently skip while a credential is configured."
            exit 1
          fi
          if grep -qiE 'could not read Username|Authentication failed|Repository not found|not found' clone-stderr.txt; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=COMPAT SUITE NOT RUN::inblockio/aqua-rs-sdk is private (or gone) and no read token is configured, so subset compatibility with the full SDK was NOT verified for this commit. Add the AQUA_RS_SDK_READ_TOKEN secret (fine-grained PAT, read-only Contents on that repo) or make it public to restore coverage."
            {
              echo "## Compat suite did not run"
              echo
              echo "\`inblockio/aqua-rs-sdk\` could not be cloned anonymously and no"
              echo "\`AQUA_RS_SDK_READ_TOKEN\` secret is configured. Subset compatibility"
              echo "with the full SDK was **not** verified for this commit. The core job"
              echo "still gates everything that runs from this checkout alone."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Any other failure (DNS, timeout, ...) is a real CI problem.
          exit 1

      - name: Install the stable toolchain
        if: steps.sdk.outputs.available == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version && cargo --version

      - name: Cache cargo registry and build output
        if: steps.sdk.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aqua-rs-sdk-core/compat-tests/target
          key: ${{ runner.os }}-cargo-compat-${{ hashFiles('aqua-rs-sdk-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-compat-

      # compat-tests is its own root package (not a workspace member), with
      # its own untracked lockfile: its dependency tree tracks the private
      # full SDK, so --locked is deliberately not used here.
      - name: Compat suite against the sibling full SDK
        if: steps.sdk.outputs.available == 'true'
        working-directory: aqua-rs-sdk-core
        run: cargo test --manifest-path compat-tests/Cargo.toml
